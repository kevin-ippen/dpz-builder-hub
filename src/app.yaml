command: ['python', 'backend/src/app.py']

env:
  - name: "ENV"
    value: "PROD"
  - name: "APP_DEMO_MODE"
    value: "false"
  - name: "APP_DB_DROP_ON_START"
    value: "false"

  - name: "PYTHONPATH"
    value: "./backend:${PYTHONPATH}"
  - name: "PYTHONUNBUFFERED"
    value: "1"
  - name: "FRONTEND_STATIC_DIR"
    value: "./static"

  # Explicit PG vars — auto-injection broke after resource restore (2026-09-08).
  # These are the Lakebase Autoscale pooler endpoint values.
  - name: "PGHOST"
    value: "ep-holy-bonus-d2zxevy5-pooler.database.us-east-1.cloud.databricks.com"
  - name: "PGDATABASE"
    value: "databricks-postgres"
  - name: "PGPORT"
    value: "5432"
  - name: "PGSCHEMA"
    value: "app_ontos"
  # Force search_path via connection options so SP finds the schema
  - name: "PGOPTIONS"
    value: "-c search_path=app_ontos,public"
  # Lakebase Autoscale endpoint for credential generation
  - name: "ENDPOINT_NAME"
    value: "projects/dpz-builder-hub-as/branches/production/endpoints/primary"
  # Legacy fallback (used if ENDPOINT_NAME is unset)
  - name: "LAKEBASE_INSTANCE_NAME"
    value: "projects/dpz-builder-hub-as/branches/production/endpoints/primary"
  
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "sql-warehouse"
  - name: "DATABRICKS_VOLUME"
    valueFrom: "volume"

  - name: "APP_ADMIN_DEFAULT_GROUPS"
    value: '["admins"]'
  - name: "APP_AUDIT_LOG_DIR"
    value: "audit_logs"
    #value: "/Volumes/${workspace.env.DATABRICKS_CATALOG}/${workspace.env.DATABRICKS_SCHEMA}/${workspace.env.DATABRICKS_VOLUME}/audit_logs"

  - name: "LLM_ENABLED"
    value: "True"
  - name: "LLM_ENDPOINT"
    valueFrom: "serving-endpoint"
  