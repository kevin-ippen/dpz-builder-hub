command: ['python', 'backend/src/app.py']

env:
  - name: "ENV"
    value: "PROD"
  - name: "APP_DEMO_MODE"
    value: "false"
  - name: "APP_DB_DROP_ON_START"
    value: "false"

  - name: "PYTHONPATH"
    value: "./backend:${PYTHONPATH}"
  - name: "PYTHONUNBUFFERED"
    value: "1"
  - name: "FRONTEND_STATIC_DIR"
    value: "./static"

  # PG host/database/port auto-injected by Databricks Apps from postgres resource.
  # Do NOT hardcode — the platform overrides env vars and hardcoded values
  # cause "no schema has been selected" errors (the pooler endpoint
  # differs from the auto-injected direct endpoint).
  # Database schema name — change to your preferred schema
  - name: "PGSCHEMA"
    value: "app_ontos"
  - name: "PGOPTIONS"
    value: "-c search_path=app_ontos,public"
  # Lakebase Autoscale endpoint for credential generation.
  # CHANGE THIS to your Lakebase project endpoint after provisioning.
  # Format: projects/<project-name>/branches/<branch>/endpoints/primary
  - name: "ENDPOINT_NAME"
    value: "projects/dpz-builder-hub-as/branches/production/endpoints/primary"
  - name: "LAKEBASE_INSTANCE_NAME"
    value: "projects/dpz-builder-hub-as/branches/production/endpoints/primary"
  
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "sql-warehouse"
  - name: "DATABRICKS_VOLUME"
    valueFrom: "volume"

  - name: "APP_ADMIN_DEFAULT_GROUPS"
    value: '["admins"]'
  - name: "APP_AUDIT_LOG_DIR"
    value: "audit_logs"
    #value: "/Volumes/${workspace.env.DATABRICKS_CATALOG}/${workspace.env.DATABRICKS_SCHEMA}/${workspace.env.DATABRICKS_VOLUME}/audit_logs"

  - name: "LLM_ENABLED"
    value: "True"
  - name: "LLM_ENDPOINT"
    valueFrom: "serving-endpoint"
  